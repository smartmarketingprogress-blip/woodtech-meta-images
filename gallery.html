<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoodTech · Διαφημίσεις καταλόγου</title>
<meta name="robots" content="noindex">
<style>
  :root { --wood:#BC9565; --dark:#272727; --bg:#f4f1ec; --ink:#111; --muted:#6b6b6b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--dark); color:#fff; padding:22px 24px 18px; }
  .top { max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .top img { height:44px; background:#fff; border-radius:8px; padding:6px 10px; }
  .top h1 { font-size:20px; margin:0; font-weight:700; }
  .top p { margin:2px 0 0; color:#cfc6b8; font-size:13px; }
  .bar { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid #e2dcd2; }
  .controls { max-width:1280px; margin:0 auto; padding:14px 24px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select, input { font:inherit; font-size:15px; padding:10px 12px; border:1px solid #d6cfc3; border-radius:10px; background:#fff; color:var(--ink); }
  select { min-width:260px; max-width:100%; }
  input { flex:1; min-width:200px; }
  .count { color:var(--muted); font-size:14px; white-space:nowrap; }
  .chips { max-width:1280px; margin:0 auto; padding:0 24px 12px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip { border:1px solid var(--wood); color:#7a5a32; background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover, .chip.on { background:var(--wood); color:#fff; }
  main { max-width:1280px; margin:0 auto; padding:20px 24px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; }
  .card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card a { display:block; aspect-ratio:1; background:#eee; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .meta { padding:10px 12px 12px; font-size:13px; line-height:1.35; }
  .meta b { display:block; font-size:14px; margin-bottom:3px; }
  .meta span { color:var(--muted); }
  .more { display:block; margin:28px auto 0; padding:12px 26px; border:0; border-radius:10px; background:var(--dark); color:#fff; font-size:15px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
  @media (max-width:600px) {
    .controls, .chips, main { padding-left:14px; padding-right:14px; }
    select { min-width:0; width:100%; }
    .grid { grid-template-columns:repeat(2,1fr); gap:10px; }
    .meta { font-size:12px; } .meta b { font-size:12.5px; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="https://www.wood-tech.gr/images/assets/logo-black.webp" alt="WoodTech">
    <div>
      <h1>Εικόνες διαφημίσεων καταλόγου</h1>
      <p id="sub">Facebook &amp; Instagram · SM Progress</p>
    </div>
  </div>
</header>
<div class="bar">
  <div class="controls">
    <select id="cat"><option value="">Όλες οι κατηγορίες</option></select>
    <input id="q" type="search" placeholder="Αναζήτηση, π.χ. αποθηκευτικό, γωνία, βελούδο…">
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Δεν βρέθηκαν προϊόντα.</div>
  <button class="more" id="more" hidden>Περισσότερα</button>
</main>
<script>
const PAGE = 60;
const QUICK = [
  ["Black Friday -15%", "__bf", ""],
  ["Καναπέδες", "Σαλόνια - γωνίες", ""],
  ["Κρεβάτια με αποθηκευτικό", "Κρεβάτια", "αποθ"],
  ["Τραπεζαρίες", "Τραπεζαρίες", ""],
  ["Ξαπλώστρες", "Ξύλινες Ξαπλώστρες", ""],
  ["Ομπρέλες", "Ομπρέλες", ""],
  ["Σετ κήπου", "Σετ σαλόνια", ""]
];
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let items = [], shown = 0, list = [];
const $ = id => document.getElementById(id);

function leaf(c) { return c.split(">").map(x => x.trim()).filter(Boolean).slice(-1)[0] || c; }

function apply(push) {
  const cat = $("cat").value, q = norm($("q").value).split(/\s+/).filter(Boolean);
  list = items.filter(it => (cat === "__bf" ? it.bf : (!cat || it.c === cat || it.c.startsWith(cat + " >"))) &&
                            q.every(w => it._s.includes(w)));
  shown = 0; $("grid").innerHTML = "";
  $("count").textContent = list.length.toLocaleString("el-GR") + " προϊόντα";
  $("empty").hidden = list.length > 0;
  render();
  document.querySelectorAll(".chip").forEach(ch =>
    ch.classList.toggle("on", ch.dataset.cat === cat && norm(ch.dataset.q) === norm($("q").value)));
  if (push) {
    const u = new URLSearchParams();
    if (cat) u.set("cat", cat);
    if ($("q").value) u.set("q", $("q").value);
    history.replaceState(null, "", u.toString() ? "?" + u : location.pathname);
  }
}

function render() {
  const frag = document.createDocumentFragment();
  for (const it of list.slice(shown, shown + PAGE)) {
    const d = document.createElement("div");
    d.className = "card";
    const src = `img/${it.id}.jpg?v=${it.v}`;
    d.innerHTML = `<a href="${src}" target="_blank" rel="noopener"><img loading="lazy" src="${src}" alt=""></a>
      <div class="meta"><b></b><span></span></div>`;
    d.querySelector("b").textContent = it.n;
    d.querySelector("span").textContent = leaf(it.c) + " · " + it.p;
    frag.appendChild(d);
  }
  $("grid").appendChild(frag);
  shown += PAGE;
  $("more").hidden = shown >= list.length;
}

fetch("products.json").then(r => r.json()).then(data => {
  items = data.items.map(it => ({ ...it, _s: norm(it.n + " " + it.c) }));
  $("sub").textContent = `Facebook & Instagram · ${items.length.toLocaleString("el-GR")} προϊόντα · ενημέρωση ${data.updated}`;
  const cats = [...new Set(items.flatMap(it => {
    const parts = it.c.split(">").map(x => x.trim());
    return parts.map((_, i) => parts.slice(0, i + 1).join(" > "));
  }))].sort((a, b) => a.localeCompare(b, "el"));
  if (items.some(it => it.bf)) {
    const o = document.createElement("option");
    o.value = "__bf"; o.textContent = "Black Friday -15%";
    $("cat").appendChild(o);
  }
  for (const c of cats) {
    const o = document.createElement("option");
    const depth = c.split(" > ").length - 1;
    o.value = c; o.textContent = "   ".repeat(depth) + leaf(c);
    $("cat").appendChild(o);
  }
  for (const [label, key, q] of QUICK) {
    const full = key === "__bf" ? (items.some(it => it.bf) ? "__bf" : null) : cats.find(c => leaf(c) === key || c === key);
    if (!full) continue;
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.dataset.cat = full; b.dataset.q = q;
    b.onclick = () => { $("cat").value = full; $("q").value = q; apply(true); };
    $("chips").appendChild(b);
  }
  const p = new URLSearchParams(location.search);
  if (p.get("cat")) $("cat").value = p.get("cat");
  if (p.get("q")) $("q").value = p.get("q");
  apply(false);
});
$("cat").onchange = () => apply(true);
let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(() => apply(true), 200); };
$("more").onclick = render;
</script>
</body>
</html>
